[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "specificity-generated-solution"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["google-adk==2.6.1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "asyncpg>=0.30,<1", "psycopg[binary]>=3,<4", "pydantic>=2,<3", "greenlet>=3,<4", "jsonschema>=4,<5", "httpx>=0.28,<1", "litellm>=1.84,<2", "python-multipart>=0.0.20,<1", "sqlalchemy>=2,<3", "alembic>=1.13,<2", "authlib>=1.6.6,<2", "fsspec>=2024.6,<2027", "mcp>=1.24,<2"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
"*" = ["*.json", "*.html"]
solution = ["migrations/*.sql"]
